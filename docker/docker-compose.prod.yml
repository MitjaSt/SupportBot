include:
  - docker-compose.postgres.yml
  - docker-compose.whisper.yml
  - docker-compose.piper.yml
  - docker-compose.prometheus.yml
  - docker-compose.grafana.yml

services:
  api:
    image: ${DOCKERHUB_REPO}:latest
    container_name: macular-api
    restart: unless-stopped
    ports:
      - "3030:3030"
    env_file:
      - ../.env.config
      - ../.env.secrets
    environment:
      NODE_ENV: production
      # Point to sidecar containers by name, not localhost
      POSTGRES_HOST: postgres
      WHISPER_URL: http://whisper:8000
      PIPER_URL: http://piper:8001
    volumes:
      - ../projects/api/.cache:/app/.cache
      - ../projects/api/drizzle:/app/drizzle
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - macular-network
