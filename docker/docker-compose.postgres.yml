services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: macular-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: macular
      POSTGRES_PASSWORD: macular_dev
      POSTGRES_DB: macular_society
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macular -d macular_society"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - macular-network

volumes:
  postgres_data:

networks:
  macular-network:
    external: true
