services:
  piper:
    build:
      context: ./piper
      dockerfile: Dockerfile
    container_name: rag-piper
    restart: unless-stopped
    ports:
      - "3050:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network

networks:
  rag-network:
    external: true
