name: Lint - TypeScript

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: projects/api/package-lock.json

      - name: Install API dependencies
        working-directory: projects/api
        run: npm ci

      - name: Run ESLint on API
        working-directory: projects/api
        run: npm run lint

      - name: Run TypeScript type check on API
        working-directory: projects/api
        run: npm run typecheck

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: projects/frontend
        run: npm ci

      - name: Run ESLint on Frontend
        working-directory: projects/frontend
        run: npm run lint

      - name: Run TypeScript type check on Frontend
        working-directory: projects/frontend
        run: npm run typecheck
